# Ingress 是 L7（HTTP/HTTPS）层的对外入口。
# 底层需要一个 Ingress Controller（本例用 ingress-nginx），
# Controller 才是真正的 Nginx/Envoy 进程；Ingress 只是配置声明。
#
# 生产更主流的替代品：Gateway API（K8s 官方下一代标准）、
#   Istio Gateway / Traefik / APISIX / 云厂商 ALB Ingress Controller。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-k8s-demo
  namespace: demo
  annotations:
    # ingress-nginx 支持的常用注解：
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"       # 请求体最大 10MB
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"     # 后端读超时（秒）
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"     # 后端写超时（秒）
    # 生产还常配的注解：
    # nginx.ingress.kubernetes.io/limit-rps: "100"           # 限流
    # nginx.ingress.kubernetes.io/enable-cors: "true"        # 跨域
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"       # HTTP → HTTPS 强制跳转
spec:
  # ingressClassName 指定用哪个 Controller。集群里通常有多个 IngressClass。
  ingressClassName: nginx

  rules:
    - host: demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix              # 前缀匹配；ImplementationSpecific / Exact 是另外两种
            backend:
              service:
                name: go-k8s-demo
                port:
                  number: 80

  # 生产必须走 HTTPS：证书用 cert-manager + Let's Encrypt 自动签发。
  # tls:
  #   - hosts:
  #       - demo.example.com
  #     secretName: demo-example-com-tls
