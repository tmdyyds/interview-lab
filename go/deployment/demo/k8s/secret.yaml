# Secret 保存敏感配置（密码、Token、私钥）。
#
# 重要提醒：Secret 默认只是 base64 编码，不是加密！
# 直接把明文 Secret 提交进 Git 仓库是常见严重事故。
#
# 生产环境的合规做法（三选一）：
#   1) Sealed Secrets：kubeseal 命令把 Secret 加密成 SealedSecret CRD，
#      加密后可以放心提交进 Git，只有目标集群里的 controller 能解密。
#   2) External Secrets Operator：从 Vault / AWS Secrets Manager /
#      阿里云 KMS 拉取，K8s 里只留一份 ExternalSecret 引用。
#   3) SOPS + KMS：文件层面加密，配合 Argo CD 插件在部署时解密。
#
# 下面这份是"演示用明文"，仅用于本地 minikube/kind 测试。
apiVersion: v1
kind: Secret
metadata:
  name: go-k8s-demo-secret
  namespace: demo
type: Opaque
stringData:
  # stringData 允许直接写明文，K8s 存储时会自动 base64 编码。
  # 用 data 字段则必须自己 base64。
  DB_PASSWORD: "replace-me-in-real-cluster"
